<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebtekar Chat</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0D1C;--panel:#11152b;--line:rgba(255,255,255,.09);--text:#F4F6FF;--muted:#A9B1D6;--cyan:#38E8FF;--indigo:#4F46E5;--violet:#7C3AED}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  background-image:radial-gradient(600px 400px at 90% -10%,rgba(124,58,237,.3),transparent 60%),radial-gradient(500px 380px at 0% 110%,rgba(34,211,238,.12),transparent 60%)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.logo{width:38px;height:38px;filter:drop-shadow(0 0 10px rgba(139,92,246,.5))}
header b{font-size:17px}header small{color:var(--muted);direction:ltr;margin-inline-start:6px}
header button{margin-inline-start:auto}
main{flex:1;overflow:auto;padding:24px 16px}
.wrap{max-width:820px;margin:auto;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:14px 18px;border-radius:22px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.user{align-self:flex-start;background:linear-gradient(135deg,var(--indigo),var(--violet));border-bottom-right-radius:6px}
.bot{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.err{align-self:center;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fecaca;font-size:14px}
.caret{display:inline-block;width:8px;height:18px;margin-inline-start:2px;background:var(--cyan);vertical-align:middle;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.empty{margin:12vh auto 0;text-align:center;color:var(--muted)}
.empty h1{font-size:30px;color:var(--text);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chips button{font-size:14px}
footer{padding:14px 16px 18px;border-top:1px solid var(--line)}
form{max-width:820px;margin:auto;display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:8px}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.7;max-height:180px;padding:8px 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:14px;padding:8px 14px}
button:hover{border-color:rgba(255,255,255,.2)}
.send{border:0;width:46px;height:46px;border-radius:50%;padding:0;background:linear-gradient(135deg,#22D3EE,var(--indigo));display:grid;place-items:center}
.send:disabled{opacity:.4;cursor:default}
.note{max-width:820px;margin:8px auto 0;text-align:center;color:#6E77A8;font-size:12px}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.png" alt=""><b>ابتکار</b><small id="model"></small>
  <button id="clear" type="button">گفتگوی تازه</button>
</header>
<main id="scroll"><div class="wrap" id="list">
  <div class="empty" id="empty">
    <h1>سلام! چطور کمکت کنم؟</h1>
    <p>هر سؤالی داری بپرس؛ جواب به‌صورت زنده نوشته می‌شود.</p>
    <div class="chips">
      <button type="button">یک ایمیل رسمی برای درخواست مرخصی بنویس</button>
      <button type="button">پایتون را در سه جمله توضیح بده</button>
      <button type="button">برای یک سفر دو روزه به اصفهان برنامه بریز</button>
    </div>
  </div>
</div></main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="از ابتکار بپرس…" required></textarea>
    <button class="send" id="send" title="ارسال"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </form>
  <p class="note">Powered by the Ebtekar Developer Gateway · ebtekarai.ir</p>
</footer>
<script>
const list = document.getElementById("list"), input = document.getElementById("input"), sendBtn = document.getElementById("send");
const scroll = document.getElementById("scroll"), empty = document.getElementById("empty");
let history = [], controller = null;

fetch("/api/config").then((r) => r.json()).then((c) => (document.getElementById("model").textContent = c.model)).catch(() => {});

function bubble(cls, text) {
  empty.hidden = true;
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  list.appendChild(el);
  scroll.scrollTop = scroll.scrollHeight;
  return el;
}

async function ask(text) {
  history.push({ role: "user", content: text });
  bubble("user", text);
  const out = bubble("bot", "");
  const txt = document.createTextNode(""), caret = document.createElement("span");
  caret.className = "caret"; out.append(txt, caret);
  let answer = "";
  controller = new AbortController();
  setBusy(true);
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: history }), signal: controller.signal });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "خطا در دریافت پاسخ");
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {           // Server-Sent Events, one line at a time
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
        if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") {
          answer += ev.delta.text;
          txt.data = answer;
          scroll.scrollTop = scroll.scrollHeight;
        } else if (ev.type === "error") throw new Error(ev.error?.message || "خطای مدل");
      }
    }
    history.push({ role: "assistant", content: answer });
  } catch (e) {
    if (e.name !== "AbortError") { out.remove(); history.pop(); bubble("err", e.message); }
    else if (answer) history.push({ role: "assistant", content: answer });
  } finally {
    caret.remove(); setBusy(false); controller = null;
  }
}

function setBusy(b) { sendBtn.disabled = b; input.disabled = b; if (!b) input.focus(); }
function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = ""; resize(); ask(text);
});
input.addEventListener("input", resize);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); } });
document.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => { input.value = b.textContent; document.getElementById("form").requestSubmit(); }));
document.getElementById("clear").addEventListener("click", () => { controller?.abort(); history = []; list.querySelectorAll(".msg").forEach((m) => m.remove()); empty.hidden = false; });
</script>
</body>
</html>
